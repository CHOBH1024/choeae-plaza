name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Install headless browser
        # Install Playwright's pinned browser build without rerunning apt dependency installation.
        run: npx playwright install chromium
      - run: npm test
      - name: Build Cloudflare Pages Functions
        run: npx --yes wrangler@4.148.0 pages functions build --project-directory . --outdir .wrangler/pages-build
      - name: Check API transport in actual Workers runtime
        run: bash scripts/smoke-api-runtime.sh
      - name: Smoke test local Pages runtime
        run: bash scripts/smoke-pages-runtime.sh
