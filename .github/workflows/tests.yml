name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - name: Build Cloudflare Pages Functions
        run: npx --yes wrangler@4.148.0 pages functions build --project-directory . --outdir .wrangler/pages-build
